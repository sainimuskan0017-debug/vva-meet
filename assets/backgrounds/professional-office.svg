<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#93c5fd" />
      <stop offset="75%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="40%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="50%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.18)" />
    </linearGradient>
    <filter id="bokehBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Sky & Horizon outside window -->
  <rect x="0" y="0" width="1920" height="700" fill="url(#skyGrad)" />
  <circle cx="960" cy="460" r="180" fill="#fef08a" opacity="0.4" filter="url(#bokehBlur)" />

  <!-- Distant City Skyline (Blurred Depth of Field) -->
  <g filter="url(#bokehBlur)" opacity="0.65">
    <rect x="120" y="320" width="140" height="380" fill="#64748b" />
    <rect x="230" y="260" width="90" height="440" fill="#475569" />
    <polygon points="275,210 230,260 320,260" fill="#334155" />
    <rect x="360" y="340" width="160" height="360" fill="#64748b" />
    <rect x="540" y="280" width="110" height="420" fill="#475569" />
    <rect x="680" y="350" width="150" height="350" fill="#64748b" />
    <rect x="850" y="240" width="130" height="460" fill="#334155" />
    <polygon points="915,180 850,240 980,240" fill="#1e293b" />
    <rect x="1010" y="310" width="120" height="390" fill="#475569" />
    <rect x="1160" y="270" width="140" height="430" fill="#334155" />
    <rect x="1330" y="330" width="170" height="370" fill="#64748b" />
    <rect x="1530" y="290" width="110" height="410" fill="#475569" />
    <rect x="1670" y="350" width="150" height="350" fill="#64748b" />
  </g>

  <!-- Hardwood Parquet Floor -->
  <rect x="0" y="680" width="1920" height="400" fill="url(#floorGrad)" />
  <g opacity="0.12" stroke="#fff" stroke-width="2">
    <line x1="0" y1="740" x2="1920" y2="740" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="0" y1="890" x2="1920" y2="890" />
    <line x1="0" y1="980" x2="1920" y2="980" />
    <!-- Diagonal floor perspectives -->
    <line x1="960" y1="680" x2="100" y2="1080" />
    <line x1="960" y1="680" x2="400" y2="1080" />
    <line x1="960" y1="680" x2="700" y2="1080" />
    <line x1="960" y1="680" x2="1220" y2="1080" />
    <line x1="960" y1="680" x2="1520" y2="1080" />
    <line x1="960" y1="680" x2="1820" y2="1080" />
  </g>

  <!-- Left Architectural Accent Wall (Modern Dark Charcoal / Slate) -->
  <polygon points="0,0 420,0 360,1080 0,1080" fill="url(#wallGrad)" />
  <!-- Acoustic Wood Slats on Accent Wall -->
  <g fill="#b45309" opacity="0.85">
    <rect x="60" y="100" width="14" height="600" rx="3" />
    <rect x="90" y="100" width="14" height="600" rx="3" />
    <rect x="120" y="100" width="14" height="600" rx="3" />
    <rect x="150" y="100" width="14" height="600" rx="3" />
    <rect x="180" y="100" width="14" height="600" rx="3" />
    <rect x="210" y="100" width="14" height="600" rx="3" />
    <rect x="240" y="100" width="14" height="600" rx="3" />
    <rect x="270" y="100" width="14" height="600" rx="3" />
    <rect x="300" y="100" width="14" height="600" rx="3" />
  </g>

  <!-- Large Window Frame (Mullions & Transoms) -->
  <g fill="#1e293b" opacity="0.95">
    <!-- Top Header Beam -->
    <rect x="0" y="0" width="1920" height="55" />
    <!-- Vertical Window Pillars -->
    <rect x="390" y="0" width="30" height="710" />
    <rect x="860" y="0" width="30" height="710" />
    <rect x="1330" y="0" width="30" height="710" />
    <rect x="1890" y="0" width="30" height="710" />
    <!-- Horizontal Cross Mullions -->
    <rect x="390" y="320" width="1530" height="18" />
    <rect x="390" y="680" width="1530" height="30" />
  </g>

  <!-- Glass Sheen & Reflection -->
  <polygon points="420,55 700,55 520,680 420,680" fill="url(#glassReflection)" />
  <polygon points="890,55 1180,55 990,680 890,680" fill="url(#glassReflection)" />
  <polygon points="1360,55 1680,55 1480,680 1360,680" fill="url(#glassReflection)" />

  <!-- Right Bookshelf / Credenza -->
  <g fill="#1e293b">
    <rect x="1540" y="380" width="340" height="380" rx="6" />
    <rect x="1560" y="400" width="300" height="150" fill="#0f172a" />
    <rect x="1560" y="580" width="300" height="150" fill="#0f172a" />
    <!-- Books on shelves -->
    <rect x="1580" y="430" width="22" height="120" fill="#ef4444" rx="2" />
    <rect x="1605" y="445" width="26" height="105" fill="#3b82f6" rx="2" />
    <rect x="1634" y="420" width="18" height="130" fill="#10b981" rx="2" />
    <rect x="1655" y="450" width="24" height="100" fill="#f59e0b" rx="2" />
    <rect x="1682" y="435" width="30" height="115" fill="#8b5cf6" rx="2" />
    <rect x="1750" y="470" width="90" height="80" fill="#334155" rx="4" />
    <!-- Lower shelf decorative vase & awards -->
    <ellipse cx="1630" cy="650" rx="30" ry="45" fill="#f8fafc" opacity="0.9" />
    <rect x="1720" y="620" width="70" height="110" fill="#f59e0b" rx="4" opacity="0.8" />
  </g>

  <!-- Designer Indoor Plant (Monstera / Fiddle-Leaf Fig) -->
  <g>
    <!-- Plant Pot -->
    <polygon points="260,820 320,820 305,950 275,950" fill="#f8fafc" />
    <ellipse cx="290" cy="820" rx="30" ry="10" fill="#e2e8f0" />
    <line x1="290" y1="820" x2="280" y2="700" stroke="#15803d" stroke-width="8" stroke-linecap="round" />
    <line x1="290" y1="820" x2="340" y2="690" stroke="#16a34a" stroke-width="7" stroke-linecap="round" />
    <line x1="290" y1="820" x2="230" y2="720" stroke="#15803d" stroke-width="7" stroke-linecap="round" />
    <!-- Broad Leaves -->
    <ellipse cx="270" cy="660" rx="65" ry="45" fill="#166534" transform="rotate(-25 270 660)" />
    <ellipse cx="350" cy="660" rx="70" ry="50" fill="#15803d" transform="rotate(30 350 660)" />
    <ellipse cx="220" cy="710" rx="55" ry="38" fill="#14532d" transform="rotate(-40 220 710)" />
    <ellipse cx="300" cy="600" rx="75" ry="55" fill="#22c55e" transform="rotate(5 300 600)" />
  </g>

  <!-- Modern Executive Desk Surface at Bottom (Soft Blur Focus) -->
  <polygon points="380,880 1540,880 1780,1080 140,1080" fill="url(#deskGrad)" />
  <line x1="380" y1="880" x2="1540" y2="880" stroke="#78716c" stroke-width="4" />

  <!-- Ambient Warm Overhead Glow -->
  <radialGradient id="ceilingLight" cx="50%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0.35" />
    <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.08" />
    <stop offset="100%" stop-color="#fff" stop-opacity="0" />
  </radialGradient>
  <rect x="0" y="0" width="1920" height="600" fill="url(#ceilingLight)" />
</svg>
