<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Seamless Cyclorama Studio Wall Gradient -->
    <radialGradient id="studioWall" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <!-- Soft Studio Key Light -->
    <radialGradient id="keyLight" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f1f5f9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0" />
    </radialGradient>
    <!-- Soft Studio Fill Light -->
    <radialGradient id="fillLight" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f1f5f9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0" />
    </radialGradient>
    <!-- Floor Gradient with Soft Horizon Falloff -->
    <linearGradient id="studioFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Studio Wall Backdrop -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#studioWall)" />
  <rect x="0" y="0" width="1920" height="1080" fill="url(#keyLight)" />
  <rect x="0" y="0" width="1920" height="1080" fill="url(#fillLight)" />

  <!-- Smooth Studio Cyclorama Infinite Curve Horizon -->
  <path d="M 0 740 Q 960 700 1920 740 L 1920 1080 L 0 1080 Z" fill="url(#studioFloor)" opacity="0.3" />
  
  <!-- Subtle Soft Studio Vignette -->
  <radialGradient id="studioVignette" cx="50%" cy="50%" r="70%">
    <stop offset="65%" stop-color="#000" stop-opacity="0" />
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.06" />
  </radialGradient>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#studioVignette)" />
</svg>
