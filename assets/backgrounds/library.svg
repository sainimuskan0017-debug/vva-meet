<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="woodPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b1d11" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#291207" />
    </linearGradient>
    <linearGradient id="shelfShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0d02" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="libraryAmbience" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#451a03" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090402" stop-opacity="0.7" />
    </radialGradient>
    <filter id="cozyBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Deep Mahogany Wall Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#woodPanel)" />

  <!-- Massive Multi-Tier Bookshelves Covering Background -->
  <!-- Top Crown Molding -->
  <rect x="0" y="0" width="1920" height="50" fill="#291207" />
  <line x1="0" y1="48" x2="1920" y2="48" stroke="#78350f" stroke-width="3" />

  <!-- Shelf Tier 1 (y: 60 - 240) -->
  <rect x="0" y="240" width="1920" height="24" fill="#58240c" />
  <rect x="0" y="260" width="1920" height="8" fill="#1c0d02" />
  <!-- Shelf Tier 2 (y: 270 - 450) -->
  <rect x="0" y="450" width="1920" height="24" fill="#58240c" />
  <rect x="0" y="470" width="1920" height="8" fill="#1c0d02" />
  <!-- Shelf Tier 3 (y: 480 - 660) -->
  <rect x="0" y="660" width="1920" height="24" fill="#58240c" />
  <rect x="0" y="680" width="1920" height="8" fill="#1c0d02" />
  <!-- Shelf Tier 4 (y: 690 - 870) -->
  <rect x="0" y="870" width="1920" height="24" fill="#58240c" />

  <!-- Vertical Shelf Dividers -->
  <g fill="#291207">
    <rect x="360" y="48" width="30" height="830" />
    <rect x="750" y="48" width="30" height="830" />
    <rect x="1140" y="48" width="30" height="830" />
    <rect x="1530" y="48" width="30" height="830" />
  </g>

  <!-- Books Rows (Colorful Antique Leather & Cloth Spines) -->
  <!-- Tier 1 Section A -->
  <g>
    <rect x="40" y="80" width="22" height="160" fill="#991b1b" rx="2" />
    <rect x="64" y="95" width="26" height="145" fill="#1e3a8a" rx="2" />
    <rect x="92" y="70" width="30" height="170" fill="#065f46" rx="2" />
    <rect x="124" y="110" width="20" height="130" fill="#78350f" rx="2" />
    <rect x="146" y="85" width="28" height="155" fill="#831843" rx="2" />
    <rect x="176" y="100" width="24" height="140" fill="#b45309" rx="2" />
    <rect x="202" y="75" width="32" height="165" fill="#1e293b" rx="2" />
    <rect x="236" y="90" width="26" height="150" fill="#991b1b" rx="2" />
    <rect x="264" y="105" width="22" height="135" fill="#065f46" rx="2" />
    <rect x="288" y="80" width="35" height="160" fill="#1e3a8a" rx="2" />
  </g>
  <!-- Tier 1 Section B (Middle) -->
  <g>
    <rect x="410" y="85" width="30" height="155" fill="#15803d" rx="2" />
    <rect x="442" y="70" width="34" height="170" fill="#b45309" rx="2" />
    <rect x="478" y="95" width="25" height="145" fill="#991b1b" rx="2" />
    <rect x="505" y="80" width="28" height="160" fill="#1e3a8a" rx="2" />
    <rect x="535" y="110" width="22" height="130" fill="#4c1d95" rx="2" />
    <rect x="560" y="90" width="32" height="150" fill="#78350f" rx="2" />
    <rect x="594" y="75" width="26" height="165" fill="#0f766e" rx="2" />
    <rect x="622" y="100" width="30" height="140" fill="#b91c1c" rx="2" />
    <rect x="654" y="85" width="28" height="155" fill="#1e293b" rx="2" />
    <rect x="684" y="70" width="34" height="170" fill="#92400e" rx="2" />
  </g>
  <!-- Tier 1 Section C (Right) -->
  <g>
    <rect x="800" y="75" width="35" height="165" fill="#1e3a8a" rx="2" />
    <rect x="837" y="90" width="25" height="150" fill="#991b1b" rx="2" />
    <rect x="864" y="80" width="30" height="160" fill="#065f46" rx="2" />
    <rect x="896" y="105" width="22" height="135" fill="#78350f" rx="2" />
    <rect x="920" y="70" width="36" height="170" fill="#4c1d95" rx="2" />
    <rect x="958" y="95" width="28" height="145" fill="#b45309" rx="2" />
    <rect x="988" y="85" width="30" height="155" fill="#1e293b" rx="2" />
    <rect x="1020" y="110" width="24" height="130" fill="#15803d" rx="2" />
    <rect x="1046" y="80" width="32" height="160" fill="#991b1b" rx="2" />
  </g>
  <!-- Tier 2 (Rows of books with gold decorative lines) -->
  <g>
    <rect x="40" y="290" width="32" height="160" fill="#78350f" rx="2" />
    <line x1="42" y1="320" x2="70" y2="320" stroke="#fef08a" stroke-width="2" />
    <rect x="74" y="305" width="28" height="145" fill="#14532d" rx="2" />
    <line x1="76" y1="335" x2="100" y2="335" stroke="#fef08a" stroke-width="2" />
    <rect x="104" y="280" width="35" height="170" fill="#831843" rx="2" />
    <rect x="141" y="315" width="24" height="135" fill="#1e3a8a" rx="2" />
    <rect x="167" y="295" width="30" height="155" fill="#b45309" rx="2" />
    <rect x="1190" y="285" width="34" height="165" fill="#1e293b" rx="2" />
    <rect x="1226" y="300" width="28" height="150" fill="#991b1b" rx="2" />
    <rect x="1256" y="280" width="32" height="170" fill="#065f46" rx="2" />
    <rect x="1290" y="310" width="26" height="140" fill="#78350f" rx="2" />
    <rect x="1580" y="285" width="36" height="165" fill="#1e3a8a" rx="2" />
    <rect x="1618" y="305" width="24" height="145" fill="#991b1b" rx="2" />
    <rect x="1644" y="290" width="30" height="160" fill="#15803d" rx="2" />
    <rect x="1676" y="280" width="34" height="170" fill="#b45309" rx="2" />
  </g>

  <!-- Classic Emerald Banker's Lamp on Desk -->
  <g>
    <!-- Brass Stand -->
    <ellipse cx="1480" cy="790" rx="36" ry="12" fill="#ca8a04" stroke="#854d0e" stroke-width="2" />
    <line x1="1480" y1="790" x2="1480" y2="670" stroke="#ca8a04" stroke-width="12" stroke-linecap="round" />
    <line x1="1450" y1="670" x2="1510" y2="670" stroke="#ca8a04" stroke-width="10" stroke-linecap="round" />
    <!-- Emerald Green Glass Shade -->
    <rect x="1430" y="640" width="100" height="40" rx="16" fill="#047857" stroke="#065f46" stroke-width="4" />
    <!-- Warm Ambient Light Glow Cone -->
    <polygon points="1440,680 1520,680 1680,950 1280,950" fill="url(#lampGlow)" />
  </g>

  <!-- Antique Mahogany Desk Surface in Foreground -->
  <polygon points="200,800 1720,800 1920,1080 0,1080" fill="#291207" />
  <line x1="200" y1="800" x2="1720" y2="800" stroke="#b45309" stroke-width="4" />
  <!-- Leather Desk Blotter with Gilt Border -->
  <polygon points="540,830 1380,830 1480,1060 440,1060" fill="#1c1917" stroke="#ca8a04" stroke-width="3" />

  <!-- Cozy Ambient Vignette & Warm Glow Over Entire Scene -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#libraryAmbience)" />
</svg>
