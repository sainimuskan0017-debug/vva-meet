<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="natureSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="40%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="bokehOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#a7f3d0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="foliageBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- Sunlit Background Sky & Soft Greenhouse Glass -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#natureSky)" />

  <!-- Soft Geometric Glass Conservatory Panes in Background -->
  <g stroke="#ffffff" stroke-width="4" opacity="0.35">
    <line x1="300" y1="0" x2="100" y2="1080" />
    <line x1="700" y1="0" x2="600" y2="1080" />
    <line x1="1200" y1="0" x2="1300" y2="1080" />
    <line x1="1600" y1="0" x2="1800" y2="1080" />
    <line x1="0" y1="300" x2="1920" y2="300" />
    <line x1="0" y1="650" x2="1920" y2="650" />
  </g>

  <!-- Distant Foliage (Blurred Depth of Field) -->
  <g filter="url(#foliageBlur)" opacity="0.75">
    <ellipse cx="200" cy="500" rx="300" ry="240" fill="#047857" />
    <ellipse cx="600" cy="400" rx="350" ry="280" fill="#059669" />
    <ellipse cx="1000" cy="450" rx="400" ry="300" fill="#10b981" />
    <ellipse cx="1400" cy="380" rx="360" ry="260" fill="#047857" />
    <ellipse cx="1750" cy="520" rx="320" ry="250" fill="#065f46" />
  </g>

  <!-- Sunlight Rays Filtering Through Canopy -->
  <polygon points="120,0 280,0 750,1080 400,1080" fill="url(#sunBeam)" />
  <polygon points="560,0 720,0 1200,1080 850,1080" fill="url(#sunBeam)" />
  <polygon points="1100,0 1300,0 1780,1080 1450,1080" fill="url(#sunBeam)" />

  <!-- Soft Bokeh Light Orbs -->
  <circle cx="340" cy="280" r="80" fill="url(#bokehOrb)" />
  <circle cx="580" cy="180" r="110" fill="url(#bokehOrb)" />
  <circle cx="980" cy="260" r="130" fill="url(#bokehOrb)" />
  <circle cx="1320" cy="210" r="95" fill="url(#bokehOrb)" />
  <circle cx="1620" cy="320" r="120" fill="url(#bokehOrb)" />
  <circle cx="820" cy="480" r="75" fill="url(#bokehOrb)" />

  <!-- Left Side Lush Tropical Leaves (Monstera Deliciosa & Palm Fronds) -->
  <g>
    <!-- Palm frond stems -->
    <path d="M 0 0 Q 320 180 420 540" stroke="#065f46" stroke-width="12" fill="none" />
    <ellipse cx="180" cy="220" rx="140" ry="40" fill="#047857" transform="rotate(35 180 220)" />
    <ellipse cx="260" cy="290" rx="130" ry="35" fill="#059669" transform="rotate(25 260 290)" />
    <ellipse cx="320" cy="380" rx="120" ry="32" fill="#10b981" transform="rotate(15 320 380)" />
    <ellipse cx="380" cy="480" rx="110" ry="30" fill="#34d399" transform="rotate(5 380 480)" />
    <!-- Monstera Leaves -->
    <path d="M 0 650 C 180 620, 280 750, 220 920 C 140 1000, 0 920, 0 650 Z" fill="#065f46" />
    <path d="M 0 350 C 220 320, 320 480, 240 680 C 120 740, 0 620, 0 350 Z" fill="#047857" />
  </g>

  <!-- Right Side Cascading Leaves & Hanging Vine Plants -->
  <g>
    <!-- Hanging Vine 1 -->
    <path d="M 1750 0 Q 1680 250 1720 450 Q 1700 600 1740 750" stroke="#047857" stroke-width="8" fill="none" />
    <ellipse cx="1710" cy="180" rx="35" ry="20" fill="#059669" transform="rotate(-30 1710 180)" />
    <ellipse cx="1740" cy="280" rx="38" ry="22" fill="#10b981" transform="rotate(35 1740 280)" />
    <ellipse cx="1700" cy="400" rx="32" ry="18" fill="#34d399" transform="rotate(-25 1700 400)" />
    <ellipse cx="1730" cy="520" rx="30" ry="16" fill="#059669" transform="rotate(20 1730 520)" />
    <!-- Hanging Vine 2 -->
    <path d="M 1520 0 Q 1460 180 1490 350" stroke="#065f46" stroke-width="6" fill="none" />
    <ellipse cx="1480" cy="120" rx="28" ry="16" fill="#10b981" transform="rotate(-35 1480 120)" />
    <ellipse cx="1500" cy="220" rx="32" ry="18" fill="#047857" transform="rotate(30 1500 220)" />
    <ellipse cx="1470" cy="310" rx="26" ry="15" fill="#34d399" transform="rotate(-20 1470 310)" />
    <!-- Broad Banana Leaf on Bottom Right -->
    <ellipse cx="1680" cy="850" rx="340" ry="160" fill="#047857" transform="rotate(-20 1680 850)" />
    <ellipse cx="1640" cy="820" rx="320" ry="140" fill="#059669" transform="rotate(-20 1640 820)" />
  </g>

  <!-- Clean Wooden Teak Terrace Decking in Foreground Bottom -->
  <polygon points="0,880 1920,880 1920,1080 0,1080" fill="#78350f" />
  <line x1="0" y1="880" x2="1920" y2="880" stroke="#b45309" stroke-width="4" />
  <!-- Teak Deck Planks -->
  <g stroke="#451a03" stroke-width="3" opacity="0.6">
    <line x1="0" y1="940" x2="1920" y2="940" />
    <line x1="0" y1="1010" x2="1920" y2="1010" />
  </g>
</svg>
